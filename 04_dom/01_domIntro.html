NodeList is a collection (list) of DOM nodes returned by methods like querySelectorAll().

Example
<p>One</p>
<p>Two</p>
<p>Three</p>
let paras = document.querySelectorAll("p");

console.log(paras);

Output:

NodeList(3) [p, p, p]
Access Elements
console.log(paras[0]); // First <p>
console.log(paras[1]); // Second <p>
Loop Through NodeList
paras.forEach((p) => {
    console.log(p.textContent);
});

Output:

One
Two
Three
Difference: NodeList vs HTMLCollection
NodeList	HTMLCollection
Returned by querySelectorAll()	Returned by getElementsByClassName(), getElementsByTagName()
Can use forEach()	Cannot use forEach() directly
Usually static	Usually live (updates automatically)
Easy Definition

NodeList = A list of DOM nodes (elements) returned by methods like querySelectorAll(), which you can access by index and iterate using forEach().
