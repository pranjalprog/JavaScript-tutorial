<!--

querySelector() and querySelectorAll() are JavaScript DOM methods used to select HTML elements using CSS selectors.

querySelector()
Returns only the first matching element.
Returns null if no element matches.
Syntax - document.querySelector("selector");

querySelectorAll()
Returns all matching elements.
Returns a NodeList (not an array).
If no elements match, it returns an empty NodeList.

Syntax - document.querySelectorAll("selector");


In the DOM, NodeList and HTMLCollection are array-like collections of DOM elements, but they have important differences.

NodeList
A collection of nodes returned by methods like querySelectorAll().
Can contain elements and, in some cases, other node types (such as text nodes).
Supports forEach() directly.


HTMLCollection
A collection of HTML elements only.
Returned by methods like:
getElementsByClassName()
getElementsByTagName()
children
Does not have a forEach() method.
-->
